# tipo = "funda"   -> entra no sorteio da Leitura do dia (e também aparece nas notícias)
# tipo = "noticia" -> só aparece nas notícias
# tema precisa ser um dos listados em [config].temas

[config]
titulo = "Leitura"
temas = ["Backend", "Databases", "Ciência da Computação", "IA", "Carreira"]
dias_noticia = 2
dias_funda = 45
max_por_tema = 8

